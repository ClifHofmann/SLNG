version: '3.8'

services:
  opensim:
    image: soupbowl/opensimulator:latest
    container_name: slng-opensim
    tty: true
    stdin_open: true
    ports:
      - "9000:9000/tcp"
      - "9000:9000/udp"
    environment:
      - ESTATE_NAME=SLNG Test Estate
      - ESTATE_OWNER_NAME=Test User
      - ESTATE_OWNER_PASSWORD=secret
      - REGION_NAME=SLNG Test Region
      - REGION_EXTERNAL_HOSTNAME=172.19.191.128
    volumes:
      - ./data:/opt/opensim/bin/sqlite-database
    restart: unless-stopped
