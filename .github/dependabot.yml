version: 2

# No package was vulnerable when this went in, and that is exactly the point: nothing would
# have told us when it stopped being true. `dotnet list package --vulnerable` is a thing someone
# has to remember to run.
#
# Weekly, not daily: this is a small project and the protocol stack is deliberately pinned
# (AGENTS.md — the tech stack does not change without an ADR). A pull request is a prompt to
# look, not an instruction to merge; a LibreMetaverse bump in particular needs the in-world round
# that unit tests cannot cover (see PR #53).
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the whole protocol stack. These ship as a matched set and a split version
      # across SLNG.Net and SLNG.Assets is its own class of bug.
      libremetaverse:
        patterns:
          - "LibreMetaverse*"
      # SkiaSharp and its Linux native assets are version-locked in lockstep by
      # SLNG.Assets.csproj's own comment; bumping one alone breaks the CI test runner.
      skiasharp:
        patterns:
          - "SkiaSharp*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
