name: Build and Release Puris Viewer

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags like v0.1.0
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  build-and-release:
    runs-on: windows-latest
    # softprops/action-gh-release needs write access to create the release; the default
    # GITHUB_TOKEN's permissions are read-only unless a job/workflow explicitly opts in (this
    # repo/org's default, confirmed live: "GitHub release failed with status: 403 - Resource
    # not accessible by integration").
    permissions:
      contents: write

    # chickensoft-games/setup-godot's own README example uses `shell: bash` on ALL platforms,
    # Windows included -- this script was written in bash syntax throughout (mkdir -p, forward-
    # slash paths) but had no `shell:` set, so it ran under pwsh (GitHub's Windows default)
    # instead. That's the confirmed root cause of a live failure where "Export Godot App"
    # completed in <1s with zero Godot output and no visible error: `godot` wasn't actually
    # invoked as expected under pwsh, even though `mkdir -p` was silently tolerated enough to
    # not hard-fail the step. Matching the action's own tested/documented shell avoids relying
    # on undocumented pwsh compatibility for a bash-authored script.
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies & Build Core/Net/Assets
      run: |
        dotnet restore SLNG.sln
        dotnet build SLNG.sln -c Release

    - name: Run Tests
      run: dotnet test SLNG.sln -c Release

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        # AGENTS.md's verified toolchain is Godot 4.7-stable (.NET/mono) -- matches what every
        # build/smoke-test in this repo's history has actually run against; 4.3 (this step's
        # original value) is a different major version with real API-compatibility risk.
        version: 4.7.0
        use-dotnet: true
        # Export templates are required for `--export-release` to produce anything; the
        # action's own README example doesn't set this because it never actually exports (only
        # --build-solutions for C# binding generation), but we do.
        include-templates: true

    - name: Export Godot App
      run: |
        mkdir -p build/windows
        # NOTE: Ensure you have an export preset named "Windows Desktop" in Godot.
        # Absolute output path via github.workspace -- a prior relative "../build/windows/..."
        # path was ambiguous (resolved against the shell's CWD, repo root, not against --path
        # app the way it does when you cd into app/ first, which is how this was verified
        # locally) and put the exported .exe one level ABOVE the repo checkout instead of
        # inside it, which the next step's relative Source: path in PurisViewer.iss then
        # couldn't find.
        godot --headless --path app --export-release "Windows Desktop" "${{ github.workspace }}/build/windows/PurisViewer.exe"

    - name: Install Inno Setup
      # minicrm/setup-inno-setup@v1 (this step's original action) doesn't exist -- GitHub
      # rejected the workflow outright with "Unable to resolve action ..., repository not
      # found" (verified: `gh api repos/minicrm/setup-inno-setup` 404s). Chocolatey is
      # preinstalled on GitHub-hosted windows-latest runners, so installing Inno Setup
      # through it avoids depending on an unverified third-party action for this.
      run: choco install innosetup -y --no-progress

    - name: Compile Inno Setup Installer
      # github.ref_name is the tag (e.g. "v0.3.3") on a tag-triggered run, so the installer
      # filename/AppVersion always matches the release instead of PurisViewer.iss's hardcoded
      # local-build fallback -- avoids ambiguous "which build is this" downloads support has
      # had to deal with across the v0.3.x round-trip debugging this session.
      #
      # MSYS_NO_PATHCONV=1 works around a Git-Bash/MSYS quirk: any argument starting with "/"
      # (like /DMyAppVersion=...) gets auto-translated as if it were a Unix path before being
      # handed to the native ISCC.exe, mangling the switch so ISCC no longer recognizes it as
      # a switch and treats it as a second script filename instead -- confirmed live: "You may
      # not specify more than one script filename." Without MSYS_NO_PATHCONV, the plain
      # `installer/PurisViewer.iss` step (no /D args) worked fine, since nothing started
      # with "/" to trigger the conversion.
      run: MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DMyAppVersion=${{ github.ref_name }}" installer/PurisViewer.iss

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Output/PurisViewer_Setup_*.exe
