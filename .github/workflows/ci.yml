name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dotnet:
    name: build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SLNG.sln

      - name: Build
        run: dotnet build SLNG.sln --no-restore -c Release

      - name: Test
        run: dotnet test SLNG.sln --no-build -c Release --verbosity normal

      # Text-level check: a `global uniform` has to be declared in BOTH the shader and
      # project.godot, and nothing else in the pipeline looks at .gdshader files at all.
      # Complementary to the selftest job below, which loads the shaders through the engine.
      - name: Check shader globals
        run: python tools/check_shader_globals.py

  selftest:
    name: smoke test (Godot --selftest)
    # windows-latest, not ubuntu: Windows is the declared primary target and it is what the
    # release build in build_installer.yml runs on, so the smoke test belongs on the platform
    # we ship.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          # Matches AGENTS.md's verified toolchain and build_installer.yml. Export templates
          # are not needed here -- this job runs the project, it does not export it.
          version: 4.7.0
          use-dotnet: true

      # MUST come before the C# build, and the order is not cosmetic. A fresh checkout has no
      # app/.godot import cache, and without it Godot cannot load a single resource -- including
      # Boot.tscn's script, which fails with "Cannot instantiate C# script". _Ready then never
      # runs, so --selftest never runs either, and the process sits in an empty scene FOREVER
      # rather than failing: the first CI run of this job had to be cancelled after 35 minutes
      # (reproduced locally by moving app/.godot aside).
      #
      # `--import` regenerates .godot from scratch, which deletes the C# assembly Godot expects
      # inside it. So importing after `dotnet build` would undo the build -- verified, that is
      # exactly the state where resources load and the script still cannot be instantiated.
      - name: Import Godot project
        run: godot --headless --path app --import

      # Debug, NOT Release, and that is load-bearing. Godot puts the C# assembly under
      # app/.godot/mono/temp/bin/<Config>/, and a non-exported `godot --path app` run loads the
      # DEBUG one. Building Release leaves only bin/Release/ there, so Godot finds no assembly and
      # fails with "Cannot instantiate C# script" for Boot.cs -- _Ready never runs, --selftest
      # never runs, and the process hangs until the timeout below kills it. That is exactly what
      # run 32712099992 did; reproduced locally by deleting bin/Debug and building Release.
      #
      # This job runs the project from source, so Debug is the correct configuration for it. The
      # Release build that ships is the EXPORT in build_installer.yml, which is a different
      # mechanism (--export-release packs its own assembly) and is unaffected by this.
      - name: Build app
        run: dotnet build app/SLNG.App.csproj -c Debug

      # Loads every shader, locale and the Bento skeleton through the engine and exits non-zero
      # on the first thing that does not come up. This is the check that would have caught the
      # black sky dome of v0.7.36-alpha; `godot --headless --editor --quit` does not compile
      # shaders and reports success on a shader that cannot compile.
      #
      # timeout-minutes AND the `timeout` command: the step cap is the backstop, the inner one
      # gives a readable failure instead of a cancelled job. Anything that stops --selftest from
      # reaching its own exit path hangs silently, which is precisely how this job burned half an
      # hour the first time, so a hang must fail fast and say so.
      - name: Self-test
        timeout-minutes: 10
        run: |
          # `|| status=$?` rather than a bare call: GitHub runs `shell: bash` with -e, so a
          # non-zero exit would abort the step before the message below could be printed.
          status=0
          timeout 300 godot --headless --path app -- --selftest || status=$?
          if [ $status -eq 124 ]; then
            echo "::error::--selftest did not exit within 300s, so it never reached SelfTest.Run. Look above for 'Cannot instantiate C# script' (assembly built for the wrong configuration, or app/.godot missing) rather than for a failing check."
          fi
          exit $status
